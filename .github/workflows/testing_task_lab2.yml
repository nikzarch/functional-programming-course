name: lab2 test

on:
  push:
    branches: [ "main" ]
    paths:
      - "lab2/sc_dict/**"
  pull_request:
    branches: [ "main" ]
    paths:
      - "lab2/sc_dict/**"

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Erlang
        uses: erlef/setup-beam@v1
        with:
          otp-version: 25.3
          rebar3-version: 3.18.0

      - name: Compile project
        working-directory: lab2/sc_dict
        run: rebar3 compile

  tests:
    runs-on: ubuntu-latest
    needs: compile

    steps:
      - uses: actions/checkout@v4

      - name: Set up Erlang
        uses: erlef/setup-beam@v1
        with:
          otp-version: 25.3
          rebar3-version: 3.18.0

      - name: Run EUnit tests
        working-directory: lab2/sc_dict
        run: rebar3 eunit
